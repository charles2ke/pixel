[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixel-album"
version = "0.1.0"
description = "A personal photo and video album stored in your own GitDb (GitHub) repository."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gitdb-py @ git+https://github.com/charles2ke/GitDb.git@d4db6fa037da26c133e813eb5c68e7ff8a485e3e",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pillow>=10",
    "ruff>=0.6",
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pixel"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
# FastAPI declares parameters with Body()/File() defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Browser-side JavaScript snippets are kept on one line.
"tests/e2e/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pixel", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
