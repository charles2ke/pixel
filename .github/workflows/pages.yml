name: Pages

# Publishes the project page (README) to GitHub Pages. GitHub Pages only serves
# static files, so the pixel server itself must be hosted elsewhere (see the
# README's "Deploying" section).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site_src
          cp README.md _site_src/index.md
          cat > _site_src/_config.yml <<'EOF'
          title: pixel
          description: A personal photo and video album stored in your own GitHub repository.
          theme: jekyll-theme-primer
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
